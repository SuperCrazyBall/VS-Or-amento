<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template de Aba Visual</title>
<link rel="stylesheet" href="visual-ui-base.css">
</head>
<body>
  <main class="vs-shell">
    <section class="vs-panel">
      <div class="vs-panel-hd blue">Nova Opção do Sistema</div>
      <div class="vs-panel-bd">
        <header class="vs-title-row">
          <div>
            <h1>Título da Aba</h1>
            <p>Use esta área para uma frase curta sobre a função da tela.</p>
          </div>
          <div class="vs-status">Pronto para iniciar.</div>
        </header>

        <section class="vs-panel">
          <div class="vs-panel-hd">Ações</div>
          <div class="vs-panel-bd">
            <div class="vs-actions">
              <button class="vbtn prim" type="button">Gerar</button>
              <button class="vbtn" type="button">Excel</button>
              <button class="vbtn" type="button">Imprimir</button>
              <button class="vbtn" type="button">Limpar</button>
            </div>
          </div>
        </section>

        <section class="vs-panel">
          <div class="vs-panel-hd">Resultado</div>
          <div class="vs-panel-bd" style="padding:0">
            <div class="vs-table-wrap">
              <table class="vs-table">
                <thead>
                  <tr>
                    <th>Código</th>
                    <th>Descrição</th>
                    <th>Filial</th>
                    <th class="num">Quantidade</th>
                    <th class="num">Valor</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>000001</td>
                    <td>Produto de exemplo</td>
                    <td>Matriz</td>
                    <td class="num">12</td>
                    <td class="num">R$ 120,00</td>
                    <td>Conferido</td>
                  </tr>
                  <tr>
                    <td>000002</td>
                    <td>Outro produto</td>
                    <td>Loja 01</td>
                    <td class="num">4</td>
                    <td class="num">R$ 39,90</td>
                    <td>Pendente</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
